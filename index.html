<body class="frameset">

    <iframe class="frame-top" name="topFrame" src="top.html" title="Top frame"></iframe>

    <iframe class="frame-left" name="leftFrame" src="left.html" title="Left frame"></iframe>

    <iframe class="frame-right" name="rightFrame" src="home.html" title="Right frame"></iframe>

    <script>
      
        (function () {
            var allowed = [
                "home.html", "login.html", "registration.html",
                "catalogue.html", "cart.html"
            ];

            var query = window.location.search;
            var page = "";
            var branch = "";

            if (query.indexOf("page=") !== -1) {
                page = query.split("page=")[1].split("&")[0];
            }
            if (query.indexOf("branch=") !== -1) {
                branch = query.split("branch=")[1].split("&")[0];
            }

            for (var i = 0; i < allowed.length; i++) {
                if (allowed[i] === page) {
                    var url = page;
                    if (branch !== "") {
                        url = page + "?branch=" + branch;
                    }
                    document.getElementsByName("rightFrame")[0].src = url;
                    break;
                }
            }
        })();
    </script>
</body>
